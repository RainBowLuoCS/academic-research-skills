<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text x="64" y="107" font-family="Calibri" font-size="40" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve"><tspan fill="#101010">What VCM changes — efficiency, representation, and scope</tspan></text><rect x="57" y="566" width="1166" height="78" fill="#FFFFFF" stroke="#004282" stroke-width="2.2"/><text x="199.93" y="614.8" font-family="Calibri" font-size="28" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve"><tspan fill="#004282">Model the concepts the instruction </tspan><tspan fill="#C00000">needs</tspan><tspan fill="#004282"> — not every token the image </tspan><tspan fill="#C00000">has</tspan><tspan fill="#004282">.</tspan></text><text x="83.68" y="699.55" font-family="Calibri" font-size="13" font-weight="bold" fill="#3C4A57" text-anchor="start" xml:space="preserve"><tspan fill="#3C4A57">Run Luo, Renke Shan, Longze Chen, Ziqiang Liu, Lu Wang, Min Yang, Xiaobo Xia. VCM: Vision Concept Modeling with Adaptive Vision Token Compression via Instruction Fine-Tuning. arXiv:2504.19627v2, 2025.</tspan></text><g transform="translate(64,146)"><rect x="0" y="0" width="264" height="94" rx="8" ry="8" fill="#DCE8F5" stroke="#004282" stroke-width="1.6"/><text x="18" y="28" font-family="Calibri" font-size="16" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">HIGH RES</text><text x="18" y="55" font-family="Calibri" font-size="14" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve">2,880 → 160 tok</text><text x="246" y="80" font-family="Calibri" font-size="13.5" font-weight="bold" fill="#004282" text-anchor="end" xml:space="preserve">70.1 avg</text><rect x="288" y="0" width="264" height="94" rx="8" ry="8" fill="#FBE4E4" stroke="#C00000" stroke-width="1.6"/><text x="306" y="28" font-family="Calibri" font-size="16" font-weight="bold" fill="#C00000" text-anchor="start" xml:space="preserve">VIDEO</text><text x="306" y="55" font-family="Calibri" font-size="14" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve">2,048 → 136 tok</text><text x="534" y="80" font-family="Calibri" font-size="13.5" font-weight="bold" fill="#C00000" text-anchor="end" xml:space="preserve">52.5 avg</text><rect x="576" y="0" width="264" height="94" rx="8" ry="8" fill="#FBEFD9" stroke="#E8A33D" stroke-width="1.6"/><text x="594" y="28" font-family="Calibri" font-size="16" font-weight="bold" fill="#E8A33D" text-anchor="start" xml:space="preserve">QWEN2-VL</text><text x="594" y="55" font-family="Calibri" font-size="14" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve">1,326 → 576 tok</text><text x="822" y="80" font-family="Calibri" font-size="13.5" font-weight="bold" fill="#E8A33D" text-anchor="end" xml:space="preserve">69.6 avg</text><rect x="864" y="0" width="264" height="94" rx="8" ry="8" fill="#DFF0E4" stroke="#1E7A46" stroke-width="1.6"/><text x="882" y="28" font-family="Calibri" font-size="16" font-weight="bold" fill="#1E7A46" text-anchor="start" xml:space="preserve">DENSE</text><text x="882" y="55" font-family="Calibri" font-size="14" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve">COCO · ADE</text><text x="1110" y="80" font-family="Calibri" font-size="13.5" font-weight="bold" fill="#1E7A46" text-anchor="end" xml:space="preserve">all improve</text><rect x="0" y="118" width="698" height="220" rx="8" ry="8" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="1.4"/><text x="16" y="143" font-family="Calibri" font-size="17" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">Three contributions</text><circle cx="34" cy="181" r="17" fill="#004282"/><text x="34" y="187" font-family="Calibri" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">1</text><text x="66" y="178" font-family="Calibri" font-size="16" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">Definition</text><text x="190" y="178" font-family="Calibri" font-size="15" fill="#101010" text-anchor="start" xml:space="preserve">quantity · identity · location</text><circle cx="34" cy="235" r="17" fill="#004282"/><text x="34" y="241" font-family="Calibri" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">2</text><text x="66" y="232" font-family="Calibri" font-size="16" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">Learning</text><text x="190" y="232" font-family="Calibri" font-size="15" fill="#101010" text-anchor="start" xml:space="preserve">text prior + forward–backward</text><circle cx="34" cy="289" r="17" fill="#004282"/><text x="34" y="295" font-family="Calibri" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">3</text><text x="66" y="286" font-family="Calibri" font-size="16" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">Outcome</text><text x="190" y="286" font-family="Calibri" font-size="15" fill="#101010" text-anchor="start" xml:space="preserve">efficiency + dense perception</text><rect x="722" y="118" width="430" height="220" rx="8" ry="8" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="1.4"/><text x="738" y="143" font-family="Calibri" font-size="17" font-weight="bold" fill="#C00000" text-anchor="start" xml:space="preserve">What remains unresolved</text><rect x="746" y="168" width="382" height="62" rx="6" ry="6" fill="#FBE4E4" stroke="#C00000" stroke-width="1.3"/><text x="762" y="192" font-family="Calibri" font-size="15" font-weight="bold" fill="#C00000" text-anchor="start" xml:space="preserve">Keyword bias</text><text x="762" y="215" font-family="Calibri" font-size="13.5" fill="#101010" text-anchor="start" xml:space="preserve">selected words may not be the true concepts</text><rect x="746" y="244" width="382" height="62" rx="6" ry="6" fill="#FBE4E4" stroke="#C00000" stroke-width="1.3"/><text x="762" y="268" font-family="Calibri" font-size="15" font-weight="bold" fill="#C00000" text-anchor="start" xml:space="preserve">Coarse mapping</text><text x="762" y="291" font-family="Calibri" font-size="13.5" fill="#101010" text-anchor="start" xml:space="preserve">min–max length normalization is simplified</text><rect x="0" y="356" width="1152" height="26" rx="6" ry="6" fill="#F0F3F7" stroke="#6E7B8B" stroke-width="1.2"/><text x="576" y="374" font-family="Calibri" font-size="15.5" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">The transferable idea: let the task decide the visual granularity</text></g></svg>