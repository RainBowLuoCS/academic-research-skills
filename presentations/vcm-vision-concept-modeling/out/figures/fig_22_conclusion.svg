<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1152" height="410" viewBox="0 0 1152 410"><rect x="0" y="0" width="690" height="300" rx="8" ry="8" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="1.4"/><text x="16" y="25" font-family="Calibri" font-size="17" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">Contributions</text><circle cx="46" cy="78" r="20" fill="#004282"/><text x="46" y="85" font-family="Calibri" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">1</text><text x="82" y="74" font-family="Calibri" font-size="19" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">Define the vision concept model</text><text x="82" y="100" font-family="Calibri" font-size="14.5" fill="#101010" text-anchor="start" xml:space="preserve">quantity, identity and location, all conditioned on the instruction</text><circle cx="46" cy="160" r="20" fill="#004282"/><text x="46" y="167" font-family="Calibri" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">2</text><text x="82" y="156" font-family="Calibri" font-size="19" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">A self-supervised framework</text><text x="82" y="182" font-family="Calibri" font-size="14.5" fill="#101010" text-anchor="start" xml:space="preserve">keyword selection plus a forward–backward algorithm; no concept labels</text><circle cx="46" cy="242" r="20" fill="#004282"/><text x="46" y="249" font-family="Calibri" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">3</text><text x="82" y="238" font-family="Calibri" font-size="19" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">Efficiency and capability together</text><text x="82" y="264" font-family="Calibri" font-size="14.5" fill="#101010" text-anchor="start" xml:space="preserve">85% fewer FLOPs, and a stronger dense-perception encoder</text><rect x="714" y="0" width="438" height="300" rx="8" ry="8" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="1.4"/><text x="730" y="25" font-family="Calibri" font-size="17" font-weight="bold" fill="#C00000" text-anchor="start" xml:space="preserve">Limitations the paper states</text><rect x="742" y="54" width="384" height="88" rx="6" ry="6" fill="#FBE4E4" stroke="#C00000" stroke-width="1.5"/><text x="762" y="82" font-family="Calibri" font-size="16" font-weight="bold" fill="#C00000" text-anchor="start" xml:space="preserve">Keyword selection is adaptive</text><text x="762" y="106" font-family="Calibri" font-size="13.5" fill="#101010" text-anchor="start" xml:space="preserve">selected keywords may not be the</text><text x="762" y="126" font-family="Calibri" font-size="13.5" fill="#101010" text-anchor="start" xml:space="preserve">true ones — a source of bias</text><rect x="742" y="158" width="384" height="88" rx="6" ry="6" fill="#FBE4E4" stroke="#C00000" stroke-width="1.5"/><text x="762" y="186" font-family="Calibri" font-size="16" font-weight="bold" fill="#C00000" text-anchor="start" xml:space="preserve">Length estimate is coarse</text><text x="762" y="210" font-family="Calibri" font-size="13.5" fill="#101010" text-anchor="start" xml:space="preserve">min-max normalization is a</text><text x="762" y="230" font-family="Calibri" font-size="13.5" fill="#101010" text-anchor="start" xml:space="preserve">simplification of the mapping</text><text x="742" y="278" font-family="Calibri" font-size="14" font-weight="bold" fill="#6E7B8B" text-anchor="start" xml:space="preserve">Next: finer keyword selection with open-source LLMs.</text><rect x="0" y="324" width="1152" height="58" rx="8" ry="8" fill="#004282"/><text x="576" y="360" font-family="Calibri" font-size="23" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Model the concepts the instruction needs — not every token the image has.</text></svg>