<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="arw-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6E7B8B"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text x="64" y="107" font-family="Calibri" font-size="40" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve"><tspan fill="#101010">What is still missing</tspan></text><rect x="57" y="566" width="1166" height="78" fill="#FFFFFF" stroke="#004282" stroke-width="2.2"/><text x="155.43" y="614.8" font-family="Calibri" font-size="28" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve"><tspan fill="#004282">Shorter is not the same as conceptual — so </tspan><tspan fill="#C00000">none of them is a vision concept model</tspan><tspan fill="#004282">.</tspan></text><text x="536.7" y="699.55" font-family="Calibri" font-size="13" font-weight="bold" fill="#3C4A57" text-anchor="start" xml:space="preserve"><tspan fill="#3C4A57">Section 1 and Section 5.1 of the paper.</tspan></text><g transform="translate(64,146)"><rect x="0" y="0" width="352" height="236" rx="8" ry="8" fill="#FFFFFF" stroke="#C00000" stroke-width="1.8"/><rect x="0" y="0" width="352" height="46" rx="8" ry="8" fill="#FBE4E4"/><rect x="0" y="36" width="352" height="10" fill="#FBE4E4"/><text x="176" y="30" font-family="Calibri" font-size="19" font-weight="bold" fill="#C00000" text-anchor="middle" xml:space="preserve">No spatial grounding</text><rect x="30" y="66" width="118" height="90" rx="4" ry="4" fill="#EDF2F8" stroke="#B9C8D8" stroke-width="1.4"/><circle cx="60.68" cy="93" r="9" fill="#F6D68A" stroke="#D9AE4E" stroke-width="1.1"/><path d="M 34 150 L 72.47999999999999 107.4 L 96.08000000000001 150 Z" stroke="#93AFC9" stroke-width="1.1" fill="#BFD3E6" stroke-linecap="round"/><path d="M 79.56 150 L 110.24000000000001 98.4 L 144 150 Z" stroke="#8AA7C2" stroke-width="1.1" fill="#A8C1DA" stroke-linecap="round"/><text x="89" y="172" font-family="Calibri" font-size="13" font-weight="bold" fill="#6E7B8B" text-anchor="middle" xml:space="preserve">image</text><path d="M 158 111 L 196 111" stroke="#6E7B8B" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arw-grey)"/><rect x="208" y="74" width="96" height="22" rx="4" ry="4" fill="#F0F3F7" stroke="#C3CFDC" stroke-width="1.3"/><text x="256" y="90" font-family="Calibri" font-size="12" fill="#6E7B8B" text-anchor="middle" xml:space="preserve">vector</text><rect x="208" y="104" width="96" height="22" rx="4" ry="4" fill="#F0F3F7" stroke="#C3CFDC" stroke-width="1.3"/><text x="256" y="120" font-family="Calibri" font-size="12" fill="#6E7B8B" text-anchor="middle" xml:space="preserve">vector</text><rect x="208" y="134" width="96" height="22" rx="4" ry="4" fill="#F0F3F7" stroke="#C3CFDC" stroke-width="1.3"/><text x="256" y="150" font-family="Calibri" font-size="12" fill="#6E7B8B" text-anchor="middle" xml:space="preserve">vector</text><text x="256" y="172" font-family="Calibri" font-size="15" font-weight="bold" fill="#C00000" text-anchor="middle" xml:space="preserve">?  where</text><text x="176" y="198" font-family="Calibri" font-size="14" fill="#101010" text-anchor="middle" xml:space="preserve">compressed vectors do not say</text><text x="176" y="219" font-family="Calibri" font-size="14" fill="#101010" text-anchor="middle" xml:space="preserve">where in the image they came from</text><rect x="400" y="0" width="352" height="236" rx="8" ry="8" fill="#FFFFFF" stroke="#C00000" stroke-width="1.8"/><rect x="400" y="0" width="352" height="46" rx="8" ry="8" fill="#FBE4E4"/><rect x="400" y="36" width="352" height="10" fill="#FBE4E4"/><text x="576" y="30" font-family="Calibri" font-size="19" font-weight="bold" fill="#C00000" text-anchor="middle" xml:space="preserve">Order and position lost</text><rect x="434" y="72" width="32" height="32" rx="4" ry="4" fill="#DCE8F5" stroke="#004282" stroke-width="1.3"/><text x="450" y="94" font-family="Calibri" font-size="15" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">1</text><rect x="474" y="72" width="32" height="32" rx="4" ry="4" fill="#DCE8F5" stroke="#004282" stroke-width="1.3"/><text x="490" y="94" font-family="Calibri" font-size="15" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">2</text><rect x="514" y="72" width="32" height="32" rx="4" ry="4" fill="#DCE8F5" stroke="#004282" stroke-width="1.3"/><text x="530" y="94" font-family="Calibri" font-size="15" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">3</text><rect x="554" y="72" width="32" height="32" rx="4" ry="4" fill="#DCE8F5" stroke="#004282" stroke-width="1.3"/><text x="570" y="94" font-family="Calibri" font-size="15" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">4</text><path d="M 608 88 L 646 88" stroke="#6E7B8B" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arw-grey)"/><rect x="658" y="72" width="18" height="32" rx="3" ry="3" fill="#F0F3F7" stroke="#C3CFDC" stroke-width="1.3"/><rect x="680" y="72" width="18" height="32" rx="3" ry="3" fill="#F0F3F7" stroke="#C3CFDC" stroke-width="1.3"/><rect x="702" y="72" width="18" height="32" rx="3" ry="3" fill="#F0F3F7" stroke="#C3CFDC" stroke-width="1.3"/><rect x="724" y="72" width="18" height="32" rx="3" ry="3" fill="#F0F3F7" stroke="#C3CFDC" stroke-width="1.3"/><text x="576" y="142" font-family="Calibri" font-size="14.5" font-weight="bold" fill="#C00000" text-anchor="middle" xml:space="preserve">order no longer recoverable</text><text x="576" y="166" font-family="Calibri" font-size="14" fill="#101010" text-anchor="middle" xml:space="preserve">→ region-level tasks break</text><text x="576" y="198" font-family="Calibri" font-size="14" fill="#101010" text-anchor="middle" xml:space="preserve">merged queries drop the relative</text><text x="576" y="219" font-family="Calibri" font-size="14" fill="#101010" text-anchor="middle" xml:space="preserve">layout the answer may depend on</text><rect x="800" y="0" width="352" height="236" rx="8" ry="8" fill="#FFFFFF" stroke="#C00000" stroke-width="1.8"/><rect x="800" y="0" width="352" height="46" rx="8" ry="8" fill="#FBE4E4"/><rect x="800" y="36" width="352" height="10" fill="#FBE4E4"/><text x="976" y="30" font-family="Calibri" font-size="19" font-weight="bold" fill="#C00000" text-anchor="middle" xml:space="preserve">Length not controllable</text><path d="M 892 140 A 62 62 0 1 1 1060 140" stroke="#C3CFDC" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M 892 140 A 62 62 0 0 1 932 84" stroke="#C00000" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="976" cy="140" r="8" fill="#004282"/><line x1="976" y1="140" x2="932" y2="96" stroke="#004282" stroke-width="3" stroke-linecap="round"/><text x="976" y="170" font-family="Calibri" font-size="15" font-weight="bold" fill="#C00000" text-anchor="middle" xml:space="preserve">fixed ratio</text><text x="976" y="198" font-family="Calibri" font-size="14" fill="#101010" text-anchor="middle" xml:space="preserve">a fixed ratio cannot follow what</text><text x="976" y="219" font-family="Calibri" font-size="14" fill="#101010" text-anchor="middle" xml:space="preserve">the instruction actually asks for</text><rect x="0" y="264" width="1152" height="62" rx="8" ry="8" fill="#004282"/><text x="576" y="292" font-family="Calibri" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Consequence:  applicable to visual question answering, and little else.</text><text x="576" y="316" font-family="Calibri" font-size="15" fill="#BBD3EA" text-anchor="middle" xml:space="preserve">Detection, segmentation and region-level tasks all need concepts that stay attached to the image.</text></g></svg>