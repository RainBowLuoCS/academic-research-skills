rt" xml:space="preserve">Which</text><text x="516" y="178" font-family="Calibri" font-size="15" fill="#101010" text-anchor="start" xml:space="preserve">only the concepts the instruction asks about</text><path d="M 440 145 Q 453 208.86 486 248" stroke="#004282" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arw-navy)"/><rect x="496" y="214" width="500" height="78" rx="8" ry="8" fill="#DCE8F5" stroke="#004282" stroke-width="1.6"/><text x="516" y="246" font-family="Calibri" font-size="21" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">Where</text><text x="516" y="274" font-family="Calibri" font-size="15" fill="#101010" text-anchor="start" xml:space="preserve">the original spatial positions are preserved</text><rect x="1016" y="22" width="136" height="248" rx="8" ry="8" fill="#DFF0E4" stroke="#1E7A46" stroke-width="1.6"/><text x="1084" y="62" font-family="Calibri" font-size="15" font-weight="bold" fill="#1E7A46" text-anchor="middle" xml:space="preserve">output</text><rect x="1036" y="78" width="14" height="14" rx="1.5" ry="1.5" fill="#FFFFFF" stroke="#DDE6EE" stroke-width="1"/><rect x="1052.2" y="78" width="14" height="14" rx="1.5" ry="1.5" fill="#FFFFFF" stroke="#DDE6EE" stroke-width="1"/><rect x="1068.4" y="78" width="14" height="14" rx="1.5" ry="1.5" fill="#FFFFFF" stroke="#DDE6EE" stroke-width="1"/><rect x="1084.6" y="78" width="14" height="14" rx="1.5" ry="1.5" fill="#FFFFFF" stroke="#DDE6EE" stroke-width="1"/><rect x="1100.8" y="78" width="14" height="14" rx="1.5" ry="1.5" fill="#FFFFFF" stroke="#DDE6EE" stroke-width="1"/><rect x="1117" y="78" width="14" height="14" rx="1.5" ry="1.5" fill="#FFFFFF" stroke="#DDE6EE" stroke-width="1"/><rect x="1036" y="94.2" width="14" height="14" rx="1.5" ry="1.5" fill="#FFFFFF" stroke="#DDE6EE" stroke-width="1"/><rect x="1052.2" y="94.2" width="14" height="14" rx="1.5" ry="1.5" fill="#9EC0E0" stroke="#004282" stroke-width="1"/><rect x="1068.4" y="94.2" width="14" height="14" rx="