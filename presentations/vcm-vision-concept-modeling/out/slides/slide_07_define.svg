<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="arw-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#004282"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text x="64" y="107" font-family="Calibri" font-size="40" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve"><tspan fill="#101010">Definition: the vision concept model</tspan></text><rect x="57" y="566" width="1166" height="78" fill="#FFFFFF" stroke="#004282" stroke-width="2.2"/><text x="117.77" y="614.8" font-family="Calibri" font-size="28" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve"><tspan fill="#004282">A model that decides </tspan><tspan fill="#C00000">how many</tspan><tspan fill="#004282"> concepts, </tspan><tspan fill="#C00000">which</tspan><tspan fill="#004282"> ones, and </tspan><tspan fill="#C00000">where</tspan><tspan fill="#004282"> — from the instruction.</tspan></text><text x="560.99" y="699.55" font-family="Calibri" font-size="13" font-weight="bold" fill="#3C4A57" text-anchor="start" xml:space="preserve"><tspan fill="#3C4A57">Contribution (1) of the paper.</tspan></text><g transform="translate(64,146)"><rect x="0" y="78" width="108" height="82" rx="4" ry="4" fill="#EDF2F8" stroke="#B9C8D8" stroke-width="1.4"/><circle cx="28.08" cy="102.6" r="8.2" fill="#F6D68A" stroke="#D9AE4E" stroke-width="1.1"/><path d="M 4 154 L 38.879999999999995 115.72 L 60.480000000000004 154 Z" stroke="#93AFC9" stroke-width="1.1" fill="#BFD3E6" stroke-linecap="round"/><path d="M 45.36 154 L 73.44000000000001 107.52 L 104 154 Z" stroke="#8AA7C2" stroke-width="1.1" fill="#A8C1DA" stroke-linecap="round"/><text x="54" y="176" font-family="Calibri" font-size="14" font-weight="bold" fill="#101010" text-anchor="middle" xml:space="preserve">image</text><re