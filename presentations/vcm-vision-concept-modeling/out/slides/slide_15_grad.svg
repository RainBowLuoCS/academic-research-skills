ibri" font-size="12" fill="#8A97A6" text-anchor="start" xml:space="preserve">The row sum is constant in t — every column redistributes the same total probability mass.</text><rect x="624" y="0" width="528" height="356" rx="8" ry="8" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="1.4"/><text x="640" y="25" font-family="Calibri" font-size="17" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">From posterior to gradient</text><rect x="648" y="54" width="480" height="56" rx="6" ry="6" fill="#F0F3F7" stroke="#6E7B8B" stroke-width="1.4"/><text x="668" y="90" font-family="Calibri" font-size="16" font-style="italic" fill="#101010" text-anchor="start" xml:space="preserve">p(Z</text><text x="688.57" y="84.56" font-family="Calibri" font-size="10.88" font-style="italic" fill="#101010" text-anchor="start" xml:space="preserve">V</text><text x="694.74" y="90" font-family="Calibri" font-size="16" font-style="italic" fill="#101010" text-anchor="start" xml:space="preserve">|Y</text><text x="709.91" y="84.56" font-family="Calibri" font-size="10.88" font-style="italic" fill="#101010" text-anchor="start" xml:space="preserve">V</text><text x="716.08" y="90" font-family="Calibri" font-size="16" font-style="italic" fill="#101010" text-anchor="start" xml:space="preserve">) = α(M,2L) + α(M,2L+1) = β(1,1) + β(1,2)</text><path d="M 888 116 L 888 134" stroke="#004282" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arw-navy)"/><rect x="648" y="136" width="480" height="52" rx="6" ry="6" fill="#F0F3F7" stroke="#6E7B8B" stroke-width="1.4"/><text x="668" y="170" font-family="Calibri" font-size="20" font-style="italic" fill="#101010" text-anchor="start" xml:space="preserve">L</text><text x="676.41" y="174" font-family="Calibri" font-size="13.6" font-style="italic" fill="#101010" text-anchor="start" xml:space="preserve">VCM</text><text x="702.74" y="170" font-family="Calibri" font-size="20" font-style="italic" fill="#101010" text-anchor="start" xml:space="preserve"> = − log p(Z</text><text x="791.6" y="163.2" font-family="Calibri" font-size="13.6" font-style="italic" fill="#101010" text-anchor="start" xml:space="preserve">V</text><text x="799.32" y="170" font-family="Calibri" font-size="20" font-style="italic" fill="#101010" text-anchor="start" xml:space="preserve">|Y</text><text x="818.27" y="163.2" font-family="Calibri" font-size="13.6" font-style="italic" fill="#101010" text-anchor="start" xml:space="preserve">V</text><text x="825.99" y="170" font-family="Calibri" font-size="20" font-style="italic" fill="#101010" text-anchor="start" xml:space="preserve">)</text><path d="M 888 194 L 888 212" stroke="#004282" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arw-navy)"/><rect x="648" y="214" width="480" height="62" rx="6" ry="6" fill="#DCE8F5" stroke="#004282" stroke-width="2"/><text x="668" y="254" font-family="Calibri" font-size="19" font-weight="bold" font-style="italic" fill="#004282" text-anchor="start" xml:space="preserve">∂L</text><text x="686.24" y="257.8" font-family="Calibri" font-size="12.92" font-weight="bold" font-style="italic" fill="#004282" text-anchor="start" xml:space="preserve">VCM</text><text x="711.67" y="254" font-family="Calibri" font-size="19" font-weight="bold" font-style="italic" fill="#004282" text-anchor="start" xml:space="preserve"> / ∂y</text><text x="747.64" y="257.8" font-family="Calibri" font-size="12.92" font-weight="bold" font-style="italic" fill="#004282" text-anchor="start" xml:space="preserve">t</text><text x="752.12" y="254" font-family="Calibri" font-size="19" font-weight="bold" font-style="italic" fill="#004282" text-anchor="start" xml:space="preserve">(z</text><text x="765.6" y="257.8" font-family="Calibri" font-size="12.92" font-weight="bold" font-style="italic" fill="#004282" text-anchor="start" xml:space="preserve">l</text><text x="768.77" y="254" font-family="Calibri" font-size="19" font-weight="bold" font-style="italic" fill="#004282" text-anchor="start" xml:space="preserve">) = p(z</text><text x="816.24" y="257.8" font-family="Calibri" font-size="12.92" font-weight="bold" font-style="italic" fill="#004282" text-anchor="start" xml:space="preserve">l</text><text x="819.42" y="254" font-family="Calibri" font-size="19" font-weight="bold" font-style="italic" fill="#004282" text-anchor="start" xml:space="preserve">|y</text><text x="837.38" y="257.8" font-family="Calibri" font-size="12.92" font-weight="bold" font-style="italic" fill="#004282" text-anchor="start" xml:space="preserve">t</text><text x="841.86" y="254" font-family="Calibri" font-size="19" font-weight="bold" font-style="italic" fill="#004282" text-anchor="start" xml:space="preserve">) − γ(t,l)</text><text x="648" y="306" font-family="Calibri" font-size="15" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve">prediction minus posterior — the same shape as CTC.</text><text x="648" y="334" font-family="Calibri" font-size="17" font-weight="bold" fill="#C00000" text-anchor="start" xml:space="preserve">keep token t   when   p(• | y) &gt; p(ø | y)</text></g></svg>