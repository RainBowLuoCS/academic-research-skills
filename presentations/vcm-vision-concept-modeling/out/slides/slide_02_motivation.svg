<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="arw-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#004282"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text x="64" y="107" font-family="Calibri" font-size="40" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve"><tspan fill="#101010">LVLMs are the interface to the real world</tspan></text><rect x="57" y="566" width="1166" height="78" fill="#FFFFFF" stroke="#004282" stroke-width="2.2"/><text x="197.85" y="614.8" font-family="Calibri" font-size="28" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve"><tspan fill="#004282">Powerful, general, deployed — and still reading every image </tspan><tspan fill="#C00000">token by token</tspan><tspan fill="#004282">.</tspan></text><text x="385.71" y="699.55" font-family="Calibri" font-size="13" font-weight="bold" fill="#3C4A57" text-anchor="start" xml:space="preserve"><tspan fill="#3C4A57">Liu et al. Visual Instruction Tuning. NeurIPS 2024. · Bai et al. Qwen-VL. arXiv:2308.12966, 2023.</tspan></text><g transform="translate(64,146)"><rect x="0" y="0" width="352" height="136" rx="8" ry="8" fill="#F0F3F7" stroke="#C9D6E4" stroke-width="1.4"/><rect x="42" y="32" width="44" height="34" rx="6" ry="6" fill="#DCE8F5" stroke="#004282" stroke-width="1.6"/><circle cx="54" cy="48" r="4.5" fill="#004282"/><circle cx="74" cy="48" r="4.5" fill="#004282"/><line x1="64" y1="26" x2="64" y2="32" stroke="#004282" stroke-width="1.8" stroke-linecap="round"/><circle cx="64" cy="23" r="3.5" fill="#C00000"/><rect x="48" y="72" width="32" height="30" rx="4" ry="4" fill="#FFFFFF" stroke="#004282" stroke-width="1.6"/><line x1="48" y1="80" x2="34" y2="92" stroke="#004282" stroke-width="1.8" stroke-linecap="round"/><line x1="80" y1="80" x2="94" y2="92" stroke="#004282" stroke-width="1.8" stroke-linecap="round"/><text x="122" y="56" font-family="Calibri" font-size="20" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve">Embodied intelligence</text><text x="122" y="82" font-family="Calibri" font-size="15" fill="#6E7B8B" text-anchor="start" xml:space="preserve">act in a physical scene</text><rect x="400" y="0" width="352" height="136" rx="8" ry="8" fill="#F0F3F7" stroke="#C9D6E4" stroke-width="1.4"/><path d="M 432 78 L 496 78" stroke="#6E7B8B" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M 436 70 L 446 52 L 480 52 L 492 70 Z" stroke="#004282" stroke-width="1.6" fill="#DCE8F5" stroke-linecap="round"/><rect x="432" y="66" width="64" height="12" rx="4" ry="4" fill="#FFFFFF" stroke="#004282" stroke-width="1.6"/><circle cx="446" cy="80" r="6" fill="#FFFFFF" stroke="#004282" stroke-width="1.8"/><circle cx="482" cy="80" r="6" fill="#FFFFFF" stroke="#004282" stroke-width="1.8"/><line x1="432" y1="94" x2="452" y2="94" stroke="#C00000" stroke-width="2.4" stroke-linecap="round"/><line x1="464" y1="94" x2="484" y2="94" stroke="#C00000" stroke-width="2.4" stroke-linecap="round"/><text x="522" y="56" font-family="Calibri" font-size="20" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve">Autonomous driving</text><text x="522" y="82" font-family="Calibri" font-size="15" fill="#6E7B8B" text-anchor="start" xml:space="preserve">read a road in real time</text><rect x="800" y="0" width="352" height="136" rx="8" ry="8" fill="#F0F3F7" stroke="#C9D6E4" stroke-width="1.4"/><rect x="838" y="26" width="52" height="76" rx="7" ry="7" fill="#FFFFFF" stroke="#004282" stroke-width="1.6"/><rect x="844" y="36" width="26" height="12" rx="3" ry="3" fill="#DCE8F5"/><rect x="858" y="54" width="26" height="12" rx="3" ry="3" fill="#9EC0E0"/><rect x="844" y="72" width="30" height="12" rx="3" ry="3" fill="#DCE8F5"/><circle cx="864" cy="94" r="4" fill="#004282"/><text x="922" y="56" font-family="Calibri" font-size="20" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve">Everyday assistants</text><text x="922" y="82" font-family="Calibri" font-size="15" fill="#6E7B8B" text-anchor="start" xml:space="preserve">answer about any screen</text><rect x="8" y="214" width="96" height="74" rx="4" ry="4" fill="#EDF2F8" stroke="#B9C8D8" stroke-width="1.4"/><circle cx="32.96" cy="236.2" r="7.4" fill="#F6D68A" stroke="#D9AE4E" stroke-width="1.1"/><path d="M 12 282 L 42.56 248.04 L 61.760000000000005 282 Z" stroke="#93AFC9" stroke-width="1.1" fill="#BFD3E6" stroke-linecap="round"/><path d="M 48.32 282 L 73.28 240.64 L 100 282 Z" stroke="#8AA7C2" stroke-width="1.1" fill="#A8C1DA" stroke-linecap="round"/><text x="56" y="306" font-family="Calibri" font-size="15" font-weight="bold" fill="#101010" text-anchor="middle" xml:space="preserve">Image</text><rect x="140" y="228" width="214" height="46" rx="8" ry="8" fill="#FFFFFF" stroke="#004282" stroke-width="1.5"/><polygon points="140,253.3 131,261.12 140,267.56" fill="#FFFFFF" stroke="#004282" stroke-width="1.5"/><text x="247" y="256.25" font-family="Calibri" font-size="15" font-weight="bold" fill="#101010" text-anchor="middle" xml:space="preserve">“What color is the collar?”</text><text x="247" y="306" font-family="Calibri" font-size="15" font-weight="bold" fill="#101010" text-anchor="middle" xml:space="preserve">Instruction</text><path d="M 374 251 L 424 251" stroke="#004282" stroke-width="2.4" fill="none" stroke-linecap="round" marker-end="url(#arw-navy)"/><rect x="436" y="206" width="356" height="106" rx="8" ry="8" fill="#DCE8F5" stroke="#004282" stroke-width="1.8"/><text x="614" y="228" font-family="Calibri" font-size="17" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">Large vision-language model</text><rect x="452" y="240" width="100" height="54" rx="6" ry="6" fill="#FFFFFF" stroke="#004282" stroke-width="1.4"/><text x="502" y="263.49" font-family="Calibri" font-size="13" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">Vision</text><text x="502" y="279.61" font-family="Calibri" font-size="13" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">encoder</text><path d="M 552 267 L 564 267" stroke="#004282" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arw-navy)"/><rect x="564" y="240" width="100" height="54" rx="6" ry="6" fill="#FFFFFF" stroke="#004282" stroke-width="1.4"/><text x="614" y="271.55" font-family="Calibri" font-size="13" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">Projector</text><path d="M 664 267 L 676 267" stroke="#004282" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arw-navy)"/><rect x="676" y="240" width="100" height="54" rx="6" ry="6" fill="#FFFFFF" stroke="#004282" stroke-width="1.4"/><text x="726" y="271.55" font-family="Calibri" font-size="13" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">LLM</text><path d="M 806 251 L 856 251" stroke="#004282" stroke-width="2.4" fill="none" stroke-linecap="round" marker-end="url(#arw-navy)"/><rect x="868" y="228" width="150" height="46" rx="8" ry="8" fill="#DFF0E4" stroke="#1E7A46" stroke-width="1.5"/><text x="943" y="256.95" font-family="Calibri" font-size="17" font-weight="bold" fill="#1E7A46" text-anchor="middle" xml:space="preserve">“Black”</text><rect x="1042" y="206" width="110" height="106" rx="8" ry="8" fill="#FBE4E4" stroke="#C00000" stroke-width="1.6"/><text x="1097" y="238" font-family="Calibri" font-size="34" font-weight="bold" fill="#C00000" text-anchor="middle" xml:space="preserve">576</text><text x="1097" y="264" font-family="Calibri" font-size="13" font-weight="bold" fill="#C00000" text-anchor="middle" xml:space="preserve">vision tokens</text><text x="1097" y="288" font-family="Calibri" font-size="12" fill="#C00000" text-anchor="middle" xml:space="preserve">for one image</text></g></svg>