<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text x="64" y="107" font-family="Calibri" font-size="40" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve"><tspan fill="#101010">Why that redundancy is expensive</tspan></text><text x="64" y="541.95" font-family="Calibri" font-size="17" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve"><tspan fill="#101010">Vision tokens dominate the sequence, and attention is quadratic in its length.</tspan></text><rect x="57" y="566" width="1166" height="78" fill="#FFFFFF" stroke="#004282" stroke-width="2.2"/><text x="212.26" y="614.8" font-family="Calibri" font-size="28" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve"><tspan fill="#004282">Higher resolution and longer video make the </tspan><tspan fill="#C00000">dominant</tspan><tspan fill="#004282"> term grow </tspan><tspan fill="#C00000">fastest</tspan><tspan fill="#004282">.</tspan></text><text x="485.55" y="699.55" font-family="Calibri" font-size="13" font-weight="bold" fill="#3C4A57" text-anchor="start" xml:space="preserve"><tspan fill="#3C4A57">Appendix D of the paper. FLOPs = T·(4nd² + 2n²d + 2ndm).</tspan></text><g transform="translate(64,146)"><text x="0" y="20" font-family="Calibri" font-size="17" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">One LVLM forward pass, sequence length n</text><rect x="0" y="36" width="666.67" height="42" rx="4" ry="4" fill="#9EC0E0" stroke="#004282" stroke-width="1.5"/><rect x="666.67" y="36" width="33.33" height="42" rx="4" ry="4" fill="#F0F3F7" stroke="#6E7B8B" stroke-width="1.5"/><text x="317.34" y="63" font-family="Calibri" font-size="20" font-weight="bold" font-style="italic" fill="#004282" text-anchor="start" xml:space="preserve">n</text><text x="327.88" y="67" font-family="Calibri" font-size="13.6" font-weight="bold" font-style="italic" fill="#004282" text-anchor="start" xml:space="preserve">img</text><text x="714" y="63" font-family="Calibri" font-size="17" font-weight="bold" font-style="italic" fill="#6E7B8B" text-anchor="start" xml:space="preserve">n</text><text x="722.96" y="66.4" font-family="Calibri" font-size="11.56" font-weight="bold" font-style="italic" fill="#6E7B8B" text-anchor="start" xml:space="preserve">sys</text><text x="737.34" y="63" font-family="Calibri" font-size="17" font-weight="bold" font-style="italic" fill="#6E7B8B" text-anchor="start" xml:space="preserve"> + n</text><text x="762.46" y="66.4" font-family="Calibri" font-size="11.56" font-weight="bold" font-style="italic" fill="#6E7B8B" text-anchor="start" xml:space="preserve">ins</text><text x="775.95" y="63" font-family="Calibri" font-size="17" font-weight="bold" font-style="italic" fill="#6E7B8B" text-anchor="start" xml:space="preserve"> + n</text><text x="801.06" y="66.4" font-family="Calibri" font-size="11.56" font-weight="bold" font-style="italic" fill="#6E7B8B" text-anchor="start" xml:space="preserve">res</text><path d="M 0 84 q 0 9 12 9 L 327.33 93 q 6 0 6 5.4 q 0 -5.4 6 -5.4 L 654.67 93 q 12 0 12 -9" stroke="#C00000" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="333.33" y="118" font-family="Calibri" font-size="15" font-weight="bold" fill="#C00000" text-anchor="middle" xml:space="preserve">vision tokens ≈ 20× everything else</text><rect x="0" y="156" width="556" height="200" rx="8" ry="8" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="1.4"/><text x="16" y="181" font-family="Calibri" font-size="17" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">Attention cost is quadratic in n</text><text x="24" y="230" font-family="Calibri" font-size="25" fill="#101010" text-anchor="start" xml:space="preserve">FLOPs = T · ( 4nd² + 2n²d + 2ndm )</text><rect x="217.19" y="206" width="55.34" height="34" rx="5" ry="5" fill="none" stroke="#C00000" stroke-width="2.2"/><text x="245.86" y="260" font-family="Calibri" font-size="14" font-weight="bold" fill="#C00000" text-anchor="middle" xml:space="preserve">grows with n²</text><text x="24" y="290" font-family="Calibri" font-size="15" fill="#101010" text-anchor="start" xml:space="preserve">Cutting the vision tokens is the only lever that</text><text x="24" y="310" font-family="Calibri" font-size="15" fill="#101010" text-anchor="start" xml:space="preserve">touches the dominant term of the sequence.</text><rect x="24" y="322" width="508" height="30" rx="6" ry="6" fill="#DFF0E4" stroke="#1E7A46" stroke-width="1.5"/><text x="278" y="342" font-family="Calibri" font-size="15" font-weight="bold" fill="#1E7A46" text-anchor="middle" xml:space="preserve">n scaled by 1/8  →  R ≈ 3/25  →  85% fewer FLOPs</text><rect x="596" y="156" width="556" height="200" rx="8" ry="8" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="1.4"/><text x="612" y="181" font-family="Calibri" font-size="17" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">… and the input keeps growing</text><line x1="636" y1="306" x2="1106" y2="306" stroke="#6E7B8B" stroke-width="1.4" stroke-linecap="round"/><rect x="662.63" y="288" width="103.4" height="18" rx="2" ry="2" fill="#DCE8F5" stroke="#004282" stroke-width="1.2"/><text x="714.33" y="279" font-family="Calibri" font-size="17" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">576</text><text x="714.33" y="325" font-family="Calibri" font-size="15" fill="#101010" text-anchor="middle" xml:space="preserve">LLaVA-1.5</text><text x="714.33" y="342" font-family="Calibri" font-size="12" fill="#6E7B8B" text-anchor="middle" xml:space="preserve">336×336</text><rect x="819.3" y="242" width="103.4" height="64" rx="2" ry="2" fill="#9EC0E0" stroke="#004282" stroke-width="1.2"/><text x="871" y="233" font-family="Calibri" font-size="17" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">2048</text><text x="871" y="325" font-family="Calibri" font-size="15" fill="#101010" text-anchor="middle" xml:space="preserve">Video-LLaVA</text><text x="871" y="342" font-family="Calibri" font-size="12" fill="#6E7B8B" text-anchor="middle" xml:space="preserve">8 frames</text><rect x="975.97" y="216" width="103.4" height="90" rx="2" ry="2" fill="#FBEFD9" stroke="#E8A33D" stroke-width="1.2"/><text x="1027.67" y="207" font-family="Calibri" font-size="17" font-weight="bold" fill="#E8A33D" text-anchor="middle" xml:space="preserve">2880</text><text x="1027.67" y="325" font-family="Calibri" font-size="15" fill="#101010" text-anchor="middle" xml:space="preserve">LLaVA-NeXT</text><text x="1027.67" y="342" font-family="Calibri" font-size="12" fill="#6E7B8B" text-anchor="middle" xml:space="preserve">high-res tiles</text><text x="636" y="352" font-family="Calibri" font-size="12.5" fill="#8A97A6" text-anchor="start" xml:space="preserve">vision tokens fed to the LLM backbone</text></g></svg>