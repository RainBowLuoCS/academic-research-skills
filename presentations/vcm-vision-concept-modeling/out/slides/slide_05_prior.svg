-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">(b)  Merge  —  fixed-length trainable queries</text><rect x="620" y="52" width="26" height="26" rx="4" ry="4" fill="#F0F3F7" stroke="#C3CFDC" stroke-width="1.3"/><rect x="652" y="52" width="26" height="26" rx="4" ry="4" fill="#F0F3F7" stroke="#C3CFDC" stroke-width="1.3"/><rect x="684" y="52" width="26" height="26" rx="4" ry="4" fill="#F0F3F7" stroke="#C3CFDC" stroke-width="1.3"/><rect x="716" y="52" width="26" height="26" rx="4" ry="4" fill="#F0F3F7" stroke="#C3CFDC" stroke-width="1.3"/><rect x="748" y="52" width="26" height="26" rx="4" ry="4" fill="#F0F3F7" stroke="#C3CFDC" stroke-width="1.3"/><rect x="780" y="52" width="26" height="26" rx="4" ry="4" fill="#F0F3F7" stroke="#C3CFDC" stroke-width="1.3"/><rect x="812" y="52" width="26" height="26" rx="4" ry="4" fill="#F0F3F7" stroke="#C3CFDC" stroke-width="1.3"/><rect x="844" y="52" width="26" height="26" rx="4" ry="4" fill="#F0F3F7" stroke="#C3CFDC" stroke-width="1.3"/><text x="620" y="104" font-family="Calibri" font-size="13" font-weight="bold" fill="#6E7B8B" text-anchor="start" xml:space="preserve">vision tokens</text><rect x="620" y="120" width="232" height="46" rx="6" ry="6" fill="#DCE8F5" stroke="#004282" stroke-width="1.6"/><text x="736" y="148.25" font-family="Calibri" font-size="15" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">cross-attention</text><rect x="642" y="180" width="34" height="26" rx="4" ry="4" fill="#FBEFD9" stroke="#E8A33D" stroke-width="1.4"/><text x="659" y="198" font-family="Calibri" font-size="14" font-weight="bold" fill="#E8A33D" text-anchor="middle" xml:space="preserve">q</text><rect x="694" y="180" width="34" height="26" rx="4" ry="4" fill="#FBEFD9" stroke="#E8A33D" stroke-width="1.4"/><text x="711" y="198" font-family="Calibri" font-size="14" font-weight="bold" fill="#E8A33D" text-anchor="middle" xml:space="preserve">q</text><rect x="746" y="180" width="34" height="26" rx="4" ry="4" fill="#FBEFD9" stroke="#E8A33D" stroke-width="1.4"/><text x="763" y="198" font-family="Calibri" font-size="14" font-weight="bold" fill="#E8A33D" text-anchor="middle" xml:space="preserve">q</text><rect x="798" y="180" width="34" height="26" rx="4" ry="4" fill="#FBEFD9" stroke="#E8A33D" stroke-width="1.4"/><text x="815" y="198" font-family="Calibri" font-size="14" font-weight="bold" fill="#E8A33D" text-anchor="middle" xml:space="preserve">q</text><text x="620" y="228" font-family="Calibri" font-size="13" font-weight="bold" fill="#E8A33D" text-anchor="start" xml:space="preserve">fixed-length learnable queries</text><path d="M 864 142 L 902 142" stroke="#004282" stroke-width="2.4" fill="none" stroke-linecap="round" marker-end="url(#arw-navy)"/><rect x="916" y="128" width="30" height="30" rx="4" ry="4" fill="#9EC0E0" stroke="#004282" stroke-width="1.3"/><rect x="954" y="128" width="30" height="30" rx="4" ry="4" fill="#9EC0E0" stroke="#004282" stroke-width="1.3"/><rect x="992" y="128" width="30" height="30" rx="4" ry="4" fill="#9EC0E0" stroke="#004282" stroke-width="1.3"/><rect x="1030" y="128" width="30" height="30" rx="4" ry="4" fill="#9EC0E0" stroke="#004282" stroke-width="1.3"/><text x="916" y="188" font-family="Calibri" font-size="14" fill="#101010" text-anchor="start" xml:space="preserve">always the same length,</text><text x="916" y="208" font-family="Calibri" font-size="14" fill="#101010" text-anchor="start" xml:space="preserve">original order discarded</text><circle cx="626" cy="256" r="4" fill="#C00000"/><text x="638" y="261" font-family="Calibri" font-size="14.5" font-weight="bold" fill="#C00000" text-anchor="start" xml:space="preserve">relative order and position are lost</text><circle cx="626" cy="282" r="4" fill="#C00000"/><text x="638" y="287" font-family="Calibri" font-size="14.5" font-weight="bold" fill="#C00000" text-anchor="start" xml:space="preserve">length cannot follow the instruction</text><rect x="0" y="330" width="1152" height="52" rx="8" ry="8" fill="#F0F3F7" stroke="#6E7B8B" stroke-width="1.5"/><text x="576" y="362" font-family="Calibri" font-size="18" font-weight="bold" fill="#101010" text-anchor="middle" xml:space="preserve">Both operate on tokens. Neither returns a concept that a downstream task can point at in the image.</text></g></svg>