<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="arw-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6E7B8B"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text x="64" y="107" font-family="Calibri" font-size="40" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve"><tspan fill="#101010">The conflict — one model, three jobs, four modalities</tspan></text><rect x="57" y="566" width="1166" height="78" fill="#FFFFFF" stroke="#004282" stroke-width="2.2"/><text x="183.4" y="614.8" font-family="Calibri" font-size="28" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve"><tspan fill="#004282">Autoregression is sequential; hybrid systems unify tasks by </tspan><tspan fill="#C00000">splitting the model</tspan><tspan fill="#004282">.</tspan></text><text x="535.92" y="699.55" font-family="Calibri" font-size="13" font-weight="bold" fill="#3C4A57" text-anchor="start" xml:space="preserve"><tspan fill="#3C4A57">Introduction and Figure 1 of the paper.</tspan></text><g transform="translate(64,146)"><text x="0" y="24" font-family="Calibri" font-size="15" font-weight="bold" fill="#C00000" text-anchor="start" xml:space="preserve">01  CAUSAL BOTTLENECK</text><text x="0" y="54" font-family="Calibri" font-size="19" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve">Autoregression forces every modality through one direction</text><rect x="18" y="92" width="31" height="31" rx="4" ry="4" fill="#004282" stroke="#FFFFFF" stroke-width="1"/><path d="M 50 107 L 58 107" stroke="#6E7B8B" stroke-width="1.6" fill="none" stroke-linecap="round" marker-end="url(#arw-grey)"/><rect x="61" y="92" width="31" height="31" rx="4" ry="4" fill="#004282" stroke="#FFFFFF" stroke-width="1"/><path d="M 93 107 L 101 107" stroke