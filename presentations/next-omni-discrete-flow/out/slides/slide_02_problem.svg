e">token 1 must wait for token 0</text><path d="M 18 174 C 120 200, 320 150, 438 180" stroke="#C00000" stroke-width="2.5" fill="none" stroke-dasharray="7 5" stroke-linecap="round"/><text x="220" y="211" font-family="Calibri" font-size="14" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">understanding wants both directions</text><text x="588" y="24" font-family="Calibri" font-size="15" font-weight="bold" fill="#E8A33D" text-anchor="start" xml:space="preserve">02  DECOUPLING TAX</text><text x="588" y="54" font-family="Calibri" font-size="19" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve">Hybrid systems solve the conflict by duplicating pathways</text><rect x="590" y="86" width="126" height="114" rx="8" ry="8" fill="#F0F3F7" stroke="#6E7B8B" stroke-width="1.5"/><text x="653" y="116" font-family="Calibri" font-size="15" font-weight="bold" fill="#6E7B8B" text-anchor="middle" xml:space="preserve">shared</text><text x="653" y="142" font-family="Calibri" font-size="15" font-weight="bold" fill="#6E7B8B" text-anchor="middle" xml:space="preserve">input</text><text x="653" y="178" font-family="Calibri" font-size="17" font-weight="bold" fill="#101010" text-anchor="middle" xml:space="preserve">T · V · A</text><path d="M 716 143 C 760 143, 760 100, 808 100" stroke="#004282" stroke-width="2.2" fill="none" stroke-linecap="round"/><rect x="820" y="82" width="288" height="38" rx="6" ry="6" fill="#DCE8F5" stroke="#004282" stroke-width="1.4"/><text x="842" y="107" font-family="Calibri" font-size="14.5" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve">understand</text><text x="1088" y="107" font-family="Calibri" font-size="13" fill="#6E7B8B" text-anchor="end" xml:space="preserve">separate module</text><path d="M 716 143 C 760 143, 760 158, 808 158" stroke="#E8A33D" stroke-width="2.2" fill="none" stroke-linecap="round"/><rect x="820" y="140" width="288" height="38" rx="6" ry="6" fill="#FBEFD9" stroke="#E8A33D" stroke-width="1.4"/><text x="842" y="165" font-family="Calibri" font-size="14.5" font-weight="bold" fill="#E8A33D" text-anchor="start" xml:space="preserve">generate</text><text x="1088" y="165" font-family="Calibri" font-size="13" fill="#6E7B8B" text-anchor="end" xml:space="preserve">separate module</text><path d="M 716 143 C 760 143, 760 216, 808 216" stroke="#7651A8" stroke-width="2.2" fill="none" stroke-linecap="round"/><rect x="820" y="198" width="288" height="38" rx="6" ry="6" fill="#EEE8F6" stroke="#7651A8" stroke-width="1.4"/><text x="842" y="223" font-family="Calibri" font-size="14.5" font-weight="bold" fill="#7651A8" text-anchor="start" xml:space="preserve">retrieve</text><text x="1088" y="223" font-family="Calibri" font-size="13" fill="#6E7B8B" text-anchor="end" xml:space="preserve">separate module</text><text x="964" y="257" font-family="Calibri" font-size="14" font-weight="bold" fill="#C00000" text-anchor="middle" xml:space="preserve">features stay separated</text><rect x="0" y="282" width="1152" height="100" rx="9" ry="9" fill="#004282" stroke="#004282" stroke-width="1.5"/><text x="28" y="316" font-family="Calibri" font-size="14" font-weight="bold" fill="#9FC0DE" text-anchor="start" xml:space="preserve">THE TARGET</text><text x="28" y="350" font-family="Calibri" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="start" xml:space="preserve">one representation</text><text x="228" y="350" font-family="Calibri" font-size="18" fill="#9FC0DE" text-anchor="start" xml:space="preserve">for</text><rect x="282" y="309" width="96" height="44" rx="22" ry="22" fill="#FFFFFF" stroke="#004282" stroke-width="2"/><text x="330" y="337" font-family="Calibri" font-size="13.5" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">TEXT</text><rect x="394" y="309" width="96" height="44" rx="22" ry="22" fill="#FFFFFF" stroke="#7651A8" stroke-width="2"/><text x="442" y="337" font-family="Calibri" font-size="13.5" font-weight="bold" fill="#7651A8" text-anchor="middle" xml:space="preserve">IMAGE</text><rect x="506" y="309" width="96" height="44" rx="22" ry="22" fill="#FFFFFF" stroke="#1889A6" stroke-width="2"/><text x="554" y="337" font-family="Calibri" font-size="13.5" font-weight="bold" fill="#1889A6" text-anchor="middle" xml:space="preserve">VIDEO</text><rect x="618" y="309" width="96" height="44" rx="22" ry="22" fill="#FFFFFF" stroke="#E8A33D" stroke-width="2"/><text x="666" y="337" font-family="Calibri" font-size="13.5" font-weight="bold" fill="#E8A33D" text-anchor="middle" xml:space="preserve">AUDIO</text><text x="744" y="338" font-family="Calibri" font-size="25" font-weight="bold" fill="#9FC0DE" text-anchor="middle" xml:space="preserve">×</text><text x="780" y="335" font-family="Calibri" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">UNDERSTAND</text><text x="898" y="335" font-family="Calibri" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">GENERATE</text><text x="1016" y="335" font-family="Calibri" font-size="12.5" font-weight="bold" fill="#D2C1E8" text-anchor="middle" xml:space="preserve">RETRIEVE</text></g></svg>