<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="arw-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#004282"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text x="64" y="107" font-family="Calibri" font-size="40" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve"><tspan fill="#101010">The alternative — discrete flow learns to correct in parallel</tspan></text><rect x="57" y="566" width="1166" height="78" fill="#FFFFFF" stroke="#004282" stroke-width="2.2"/><text x="177.28" y="614.8" font-family="Calibri" font-size="28" font-weight="bold" fill="#004282" text-anchor="start" xml:space="preserve"><tspan fill="#004282">Corrupt globally, predict globally, refine iteratively — with </tspan><tspan fill="#C00000">bidirectional context</tspan><tspan fill="#004282">.</tspan></text><text x="516.01" y="699.55" font-family="Calibri" font-size="13" font-weight="bold" fill="#3C4A57" text-anchor="start" xml:space="preserve"><tspan fill="#3C4A57">Sections 2.3–2.4 and Appendix A of the paper.</tspan></text><g transform="translate(64,146)"><text x="0" y="25" font-family="Calibri" font-size="19" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve">A probability path replaces a causal chain</text><text x="1152" y="25" font-family="Calibri" font-size="14" font-weight="bold" fill="#C00000" text-anchor="end" xml:space="preserve">all positions move together</text><path d="M 40 166 C 280 36, 520 282, 760 136 C 900 50, 1010 86, 1110 80" stroke="#D8E5F2" stroke-width="60" fill="none" stroke-linecap="round" opacity="0.9"/><path d="M 40 166 C 280 36, 520 282, 760 136 C 900 50, 1010 86, 1110 80" stroke="#004282" stroke-width="3.5" fill="none" stroke-linecap="round" marker-end="url(#arw-navy)"/><circle cx="64" cy="156" r="42" fill="#FFFFFF" stroke="#004282" stroke-width="2.2"/><rect x="39" y="139" width="11" height="11" rx="2" ry="2" fill="#6E7B8B"/><rect x="54" y="139" width="11" height="11" rx="2" ry="2" fill="#6E7B8B"/><rect x="69" y="139" width="11" height="11" rx="2" ry="2" fill="#6E7B8B"/><rect x="84" y="139" width="11" height="11" rx="2" ry="2" fill="#6E7B8B"/><rect x="39" y="157" width="11" height="11" rx="2" ry="2" fill="#6E7B8B"/><rect x="54" y="157" width="11" height="11" rx="2" ry="2" fill="#6E7B8B"/><rect x="69" y="157" width="11" height="11" rx="2" ry="2" fill="#6E7B8B"/><rect x="84" y="157" width="11" height="11" rx="2" ry="2" fill="#6E7B8B"/><text x="64" y="218" font-family="Calibri" font-size="15" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">t = 0</text><text x="64" y="238" font-family="Calibri" font-size="12.5" fill="#6E7B8B" text-anchor="middle" xml:space="preserve">noise</text><circle cx="544" cy="207" r="42" fill="#FFFFFF" stroke="#004282" stroke-width="2.2"/><rect x="519" y="190" width="11" height="11" rx="2" ry="2" fill="#6E7B8B"/><rect x="534" y="190" width="11" height="11" rx="2" ry="2" fill="#004282"/><rect x="549" y="190" width="11" height="11" rx="2" ry="2" fill="#6E7B8B"/><rect x="564" y="190" width="11" height="11" rx="2" ry="2" fill="#7651A8"/><rect x="519" y="208" width="11" height="11" rx="2" ry="2" fill="#1889A6"/><rect x="534" y="208" width="11" height="11" rx="2" ry="2" fill="#6E7B8B"/><rect x="549" y="208" width="11" height="11" rx="2" ry="2" fill="#E8A33D"/><rect x="564" y="208" width="11" height="11" rx="2" ry="2" fill="#004282"/><text x="544" y="269" font-family="Calibri" font-size="15" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">t = .5</text><text x="544" y="289" font-family="Calibri" font-size="12.5" fill="#6E7B8B" text-anchor="middle" xml:space="preserve">mixed</text><circle cx="1062" cy="82" r="42" fill="#FFFFFF" stroke="#004282" stroke-width="2.2"/><rect x="1037" y="65" width="11" height="11" rx="2" ry="2" fill="#004282"/><rect x="1052" y="65" width="11" height="11" rx="2" ry="2" fill="#004282"/><rect x="1067" y="65" width="11" height="11" rx="2" ry="2" fill="#7651A8"/><rect x="1082" y="65" width="11" height="11" rx="2" ry="2" fill="#7651A8"/><rect x="1037" y="83" width="11" height="11" rx="2" ry="2" fill="#1889A6"/><rect x="1052" y="83" width="11" height="11" rx="2" ry="2" fill="#1889A6"/><rect x="1067" y="83" width="11" height="11" rx="2" ry="2" fill="#E8A33D"/><rect x="1082" y="83" width="11" height="11" rx="2" ry="2" fill="#004282"/><text x="1062" y="144" font-family="Calibri" font-size="15" font-weight="bold" fill="#004282" text-anchor="middle" xml:space="preserve">t = 1</text><text x="1062" y="164" font-family="Calibri" font-size="12.5" fill="#6E7B8B" text-anchor="middle" xml:space="preserve">data</text><rect x="214" y="102" width="248" height="72" rx="8" ry="8" fill="#FFFFFF" stroke="#C00000" stroke-width="1.7"/><text x="338" y="130" font-family="Calibri" font-size="15" font-weight="bold" fill="#C00000" text-anchor="middle" xml:space="preserve">predict kinetic velocity</text><text x="267.8" y="158" font-family="Calibri" font-size="17" font-style="italic" fill="#101010" text-anchor="start" xml:space="preserve">v_t  →  p</text><text x="329.04" y="161.4" font-family="Calibri" font-size="11.56" font-style="italic" fill="#101010" text-anchor="start" xml:space="preserve">1|t</text><text x="344.1" y="158" font-family="Calibri" font-size="17" font-style="italic" fill="#101010" text-anchor="start" xml:space="preserve">(x_1|x_t)</text><rect x="712" y="192" width="242" height="58" rx="8" ry="8" fill="#FFFFFF" stroke="#7651A8" stroke-width="1.7"/><text x="833" y="219" font-family="Calibri" font-size="15" font-weight="bold" fill="#7651A8" text-anchor="middle" xml:space="preserve">correct every position</text><text x="833" y="239" font-family="Calibri" font-size="13" fill="#101010" text-anchor="middle" xml:space="preserve">with bidirectional context</text><rect x="0" y="286" width="368" height="96" rx="8" ry="8" fill="#FBE4E4" stroke="#C00000" stroke-width="1.5"/><text x="22" y="319" font-family="Calibri" font-size="16" font-weight="bold" fill="#C00000" text-anchor="start" xml:space="preserve">01  CORRUPT</text><text x="22" y="351" font-family="Calibri" font-size="14.5" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve">sample xₜ on a metric-induced path</text><path d="M 370 334 L 388 334" stroke="#004282" stroke-width="2.1" fill="none" stroke-linecap="round" marker-end="url(#arw-navy)"/><rect x="392" y="286" width="368" height="96" rx="8" ry="8" fill="#EEE8F6" stroke="#7651A8" stroke-width="1.5"/><text x="414" y="319" font-family="Calibri" font-size="16" font-weight="bold" fill="#7651A8" text-anchor="start" xml:space="preserve">02  PREDICT</text><text x="414" y="351" font-family="Calibri" font-size="14.5" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve">recover clean tokens at every position</text><path d="M 762 334 L 780 334" stroke="#004282" stroke-width="2.1" fill="none" stroke-linecap="round" marker-end="url(#arw-navy)"/><rect x="784" y="286" width="368" height="96" rx="8" ry="8" fill="#DFF0E4" stroke="#1E7A46" stroke-width="1.5"/><text x="806" y="319" font-family="Calibri" font-size="16" font-weight="bold" fill="#1E7A46" text-anchor="start" xml:space="preserve">03  REFINE</text><text x="806" y="351" font-family="Calibri" font-size="14.5" font-weight="bold" fill="#101010" text-anchor="start" xml:space="preserve">iterate in parallel until t = 1</text></g></svg>